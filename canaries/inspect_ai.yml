# inspect_ai's offline suite on the newest releases of everything.
name: inspect_ai
repo: UKGovernmentBEIS/inspect_ai
ref: main
cadence: 2h
python: "3.11"
timeout-minutes: 60
install: |
  uv venv
  uv pip install --exclude-newer false -e ".[dev]"
test: |
  uv run --no-sync pytest -ra -n logical --timeout=900 --timeout-method=thread

# inspect_ai on the newest releases of everything: one canary, so a break
# alerts once, in four parts that run in parallel, each with only its own
# install:
#  - asyncio: the slow suite (the slow-tests job of meridianlabs-ai/actions'
#    inspect-ai-scheduled-tests.yml, without --runapi or keys; tests that need
#    a provider key skip themselves), then mypy, which catches a new release
#    changing types the tests don't touch;
#  - trio: the slow suite's trio variants;
#  - sandbox-tools: the sandbox tools package's own tests (the
#    sandbox-tools-unit job of inspect_ai's build.yml; no Docker);
#  - docs: the docs site render (the docs job of build.yml; the site doesn't
#    execute code, and the package is installed for the reference pages).
name: inspect_ai
repo: UKGovernmentBEIS/inspect_ai
ref: main
cadence: 2h
python: "3.11"
timeout-minutes: 60
# The slow suite's environment, for asyncio and trio. The shared install action
# does the install (see README.md, "install-with"): an editable install of the
# dev extra, with pytest-timeout in the same resolution, then the test package
# with --no-deps so ensure_test_package_installed() doesn't install it mid-run.
# versions: unlocked makes each install
# `uv pip install --no-config --exclude-newer false`. --exclude-newer false
# clears the cooldown; --no-config (from project-uv-settings: ignore) also drops
# the repo's per-package cooldowns ([tool.uv.exclude-newer-package]), and
# --exclude-newer false also overrides UV_EXCLUDE_NEWER if a runner sets it.
install-with:
  versions: unlocked
  project-uv-settings: ignore
  extras: dev
  also-install-unlocked: pytest-timeout
  also-install-without-deps: ./tests/test_package
variants:
  - label: asyncio
    test: |
      export DOCKER_BUILDKIT=1 BUILDKIT_PROGRESS=plain
      # Compose 2.38 bake shares image IDs across projects; drop at Compose >= 2.39.
      export COMPOSE_BAKE=false
      trap 'docker system prune -f; docker volume prune -f' EXIT
      status=0
      uv run --no-sync pytest -ra --runslow --ignore=tests/agent/test_agent_human.py -k "not test_mcp_sampling_fn" \
        -n logical --timeout=900 --timeout-method=thread || status=1
      # mypy runs even if the tests failed.
      echo "::group::mypy"; uv run --no-sync mypy --exclude tests/test_package src tests || status=1; echo "::endgroup::"
      exit $status
  - label: trio
    test: |
      export DOCKER_BUILDKIT=1 BUILDKIT_PROGRESS=plain
      export COMPOSE_BAKE=false
      trap 'docker system prune -f; docker volume prune -f' EXIT
      uv run --no-sync pytest -ra --runslow --runtrio --ignore=tests/agent/test_agent_human.py -k "not test_mcp_sampling_fn" \
        -n logical --timeout=1500 --timeout-method=thread
  - label: sandbox-tools
    timeout-minutes: 15
    # The sandbox tools package is not the project, so the project install is
    # skipped and the package path is in also-install-unlocked.
    install-with:
      versions: unlocked
      project-uv-settings: ignore
      project-install: skip
      also-install-unlocked: ./src/inspect_sandbox_tools[dev]
    test: |
      uv run --no-sync pytest src/inspect_sandbox_tools/tests/ -ra
  - label: docs
    timeout-minutes: 30
    # The docs site render installs the project (not editable) with its doc
    # extra, at the newest releases. versions: unlocked makes it
    # `uv pip install --no-config --exclude-newer false ".[doc]"`.
    install-with:
      versions: unlocked
      project-uv-settings: ignore
      project-install: skip
      also-install-unlocked: .[doc]
    test: |
      uv run --no-sync quarto render docs

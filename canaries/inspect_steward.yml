# inspect_steward's test suite and pyright on the newest releases of everything
# (its own uv.lock and any exclude-newer window ignored), in two parts that run
# in parallel so a break alerts once. Both run the offline suite
# (-m "not network") and pyright, as inspect_steward's build.yaml does:
#  - offline: CI's Python 3.12 leg;
#  - offline-3.14: CI's Python 3.14 leg.
name: inspect_steward
repo: meridianlabs-ai/inspect_steward
ref: main
cadence: nightly
python: "3.12"
timeout-minutes: 30
# The shared install action does the install (see README.md, "install-with"):
# an editable install of the dev extra, with inspect_harbor main in the same
# resolution in place of the git source that UV_NO_SOURCES drops. --no-config
# also drops steward's override-dependencies (openai, for litellm's old
# openai<3 cap); litellm lifted that cap in 1.108.0, and it isn't in this
# resolution.
install-with:
  versions: unlocked
  project-uv-settings: ignore
  extras: dev
  also-install-unlocked: git+https://github.com/meridianlabs-ai/inspect_harbor.git@main
test: |
  # Every check runs; the step fails if any did.
  status=0
  # py-test job of inspect_steward's build.yaml (uv run pytest -m "not network").
  echo "::group::pytest"; uv run --no-sync pytest -ra -m "not network" || status=1; echo "::endgroup::"
  # py-pyright job of inspect_steward's build.yaml (uv run pyright).
  echo "::group::pyright"; uv run --no-sync pyright || status=1; echo "::endgroup::"
  exit $status
variants:
  - label: offline
  - label: offline-3.14
    python: "3.14"

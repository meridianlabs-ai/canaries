# inspect_steward's test suite and pyright on the newest releases of everything
# (its own uv.lock and any exclude-newer window ignored), in two parts that run
# in parallel so a break alerts once:
#  - offline: the default suite (-m "not network") and pyright, as inspect_steward's
#    build.yaml runs them;
#  - network: the network-marked tests, which nothing runs today (CI runs
#    -m "not network" on every leg). They need the hawk extra (Python 3.13+, so
#    this part runs on 3.14), network and the uv binary, and sole use of the
#    environment because hawk's CLI rewrites the venv (pyproject's `network`
#    marker; run with -n0).
name: inspect_steward
repo: meridianlabs-ai/inspect_steward
ref: main
cadence: nightly
python: "3.12"
timeout-minutes: 30
install: |
  uv venv
  uv pip install --exclude-newer false -e . --group dev
variants:
  - label: offline
    test: |
      # Every check runs; the step fails if any did.
      status=0
      # py-test job of inspect_steward's build.yaml (uv run pytest -m "not network").
      echo "::group::pytest"; uv run --no-sync pytest -ra -m "not network" || status=1; echo "::endgroup::"
      # py-pyright job of inspect_steward's build.yaml (uv run pyright).
      echo "::group::pyright"; uv run --no-sync pyright || status=1; echo "::endgroup::"
      exit $status
  - label: network
    python: "3.14"
    # hawk (the [hawk] extra) needs Python 3.13+, so the network tests only
    # resolve a hawk here; on 3.12 the extra is empty and they are unavailable.
    install: |
      uv venv
      uv pip install --exclude-newer false -e ".[hawk]" --group dev
    test: |
      # The network tests shell out to `uv pip install` into this venv, so they
      # run alone (-n0) and get the whole environment to themselves. Nothing in
      # CI runs them. (inspect_steward's pyproject `network` marker.)
      uv run --no-sync pytest -ra -m network -n0

# Checks inspect_vscode against what its users bring: the newest inspect-ai and
# inspect-scout, and the newest stable VS Code.
# - proxy-routes: the extension's webview proxy rejects any view-server route
#   it doesn't recognize, so this dumps the routes the newest inspect-ai and
#   inspect-scout serve and checks each one against the proxy's table.
#   Meant to replace inspect_vscode's proxy-routes.yml.
# - The extension tests run in the newest stable VS Code, which
#   @vscode/test-electron downloads when no version is set. `pnpm test` builds
#   the extension first (its pretest script).
# The VSIX bundles its npm dependencies at build time, so they install from the
# lockfile, and lint, the production build and packaging stay in
# inspect_vscode's CI.
name: inspect_vscode
repo: meridianlabs-ai/inspect_vscode
ref: main
cadence: nightly
python: "3.12"
node: "22"
timeout-minutes: 30
# The shared install action installs the newest inspect-ai and inspect-scout
# (see README.md, "install-with"); inspect_vscode has no Python project.
install-with:
  versions: unlocked
  project-uv-settings: ignore
  project-install: skip
  also-install-unlocked: |
    inspect-ai
    inspect-scout
install: |
  corepack enable
  pnpm install --frozen-lockfile
  # The extension tests drive a real VS Code: xvfb gives it a display, and the
  # shell-integration tests need fish (ubuntu-latest already ships PowerShell).
  sudo apt-get update
  sudo apt-get install -y xvfb fish
test: |
  # Every check runs; the step fails if any did.
  status=0
  # The proxy-routes check: dump the newest servers' routes, compile the proxy
  # table (also the TypeScript type check), then check each route against it.
  # These three run in order; check.mjs needs compile-tests' output.
  echo "::group::proxy-routes"
  .venv/bin/python scripts/proxy-routes/dump-openapi.py --out out/proxy-routes \
    && pnpm compile-tests \
    && node scripts/proxy-routes/check.mjs \
    || status=1
  echo "::endgroup::"
  # The six view-asset tests skip here because inspect/scout in .venv/bin aren't on the extension test
  # host's PATH (VS Code's Linux test host rebuilds PATH from a login shell); they also skip in the repo's
  # own CI, where inspect/scout aren't installed. VSCODE_CLI=1 makes Scout's suite fail on mocha's 2 s hook
  # timeout, so left skipped; proxy-routes covers the route table, not asset layout.
  echo "::group::test"; REQUIRE_FISH_TESTS=1 REQUIRE_PWSH_TESTS=1 xvfb-run -a pnpm test || status=1; echo "::endgroup::"
  exit $status

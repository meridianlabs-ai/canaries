# petri_bloom's offline test suite and pyright on the newest releases of
# everything (its own uv.lock and any exclude-newer window ignored).
name: petri_bloom
repo: meridianlabs-ai/petri_bloom
ref: main
cadence: nightly
python: "3.12"
timeout-minutes: 30
# The shared install action does the install (see README.md, "install-with"):
# an editable install of the dev extra. --no-config (from project-uv-settings:
# ignore) drops the repo's per-package cooldowns, and --exclude-newer false
# (from versions: unlocked) clears the cooldown.
install-with:
  versions: unlocked
  project-uv-settings: ignore
  extras: dev
  # Temporary hold. The types-PyYAML stubs from Nov-22 on use
  # _typeshed.FloatInt, which pyright 1.1.414 does not have, so pyright fails.
  # Pyright 1.1.415 has it:
  # https://github.com/microsoft/pyright/releases/tag/1.1.415
  # Remove when pyright 1.1.415 is on PyPI.
  also-install-unlocked: types-PyYAML<6.0.12.20261122
test: |
  # Every check runs; the step fails if any did.
  status=0
  # py-test job of petri_bloom's build.yaml.
  echo "::group::pytest"; uv run --no-sync pytest -ra || status=1; echo "::endgroup::"
  # py-pyright job of petri_bloom's build.yaml.
  echo "::group::pyright"; uv run --no-sync pyright || status=1; echo "::endgroup::"
  exit $status

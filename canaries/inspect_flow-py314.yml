# inspect_flow main against the newest releases of everything, inspect_ai
# included: tests (slow included), ruff and pyright.
name: inspect_flow-py314
repo: meridianlabs-ai/inspect_flow
ref: main
cadence: 2h
python: "3.14"
timeout-minutes: 45
install: |
  uv sync --dev --upgrade --exclude-newer false
test: |
  # setup-uv exports UV_PYTHON for the install; unset it so the tests that build
  # venvs for other Python versions get the version they ask for.
  unset UV_PYTHON
  status=0
  uv run --no-sync pytest --runslow || status=1
  uv run --no-sync ruff check . || status=1
  uv run --no-sync ruff format --check . || status=1
  uv run --no-sync pyright || status=1
  exit $status

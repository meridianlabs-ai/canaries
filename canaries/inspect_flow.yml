# inspect_flow main against the newest releases of everything, inspect_ai
# included, on the newest Python in its CI, as one canary so a break alerts
# once: tests (slow included), pyright, and the generated-types drift check.
name: inspect_flow
repo: meridianlabs-ai/inspect_flow
ref: main
cadence: 2h
python: "3.14"
timeout-minutes: 45
install: |
  uv sync --dev --upgrade --exclude-newer false
test: |
  # setup-uv exports UV_PYTHON for the install; unset it so the tests that build
  # venvs for other Python versions get the version they ask for.
  unset UV_PYTHON
  # Every check runs; the step fails if any did.
  status=0
  echo "::group::pytest"; uv run --no-sync pytest --runslow || status=1; echo "::endgroup::"
  echo "::group::pyright"; uv run --no-sync pyright || status=1; echo "::endgroup::"
  # check-type-gen job of inspect_flow's build.yaml: regenerate the types and
  # fail if the committed copy no longer matches. type_gen.py writes only
  # src/inspect_flow/_types/generated.py, so scope the diff to it: `uv sync
  # --upgrade` rewrites uv.lock, which would make a bare git status always dirty.
  echo "::group::type-gen drift"
  uv run --no-sync python src/inspect_flow/_types/type_gen.py || status=1
  git diff --exit-code -- src/inspect_flow/_types/generated.py || status=1
  echo "::endgroup::"
  exit $status

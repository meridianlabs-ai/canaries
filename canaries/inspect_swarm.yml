# inspect_swarm's test suite (slow Docker tests included) and pyright on the
# newest releases of everything (its own uv.lock and any exclude-newer window
# ignored).
name: inspect_swarm
repo: meridianlabs-ai/inspect_swarm
ref: main
cadence: nightly
python: "3.11"
timeout-minutes: 30
# The shared install action does the install (see README.md, "install-with"):
# an editable install of the dev extra. --no-config (from project-uv-settings:
# ignore) drops the repo's per-package cooldowns, and --exclude-newer false
# (from versions: unlocked) clears the cooldown. The workflow step sets
# UV_NO_SOURCES, so inspect-ai comes from its newest release, not the git source
# in pyproject. Testing against inspect_ai main stays in swarm's own CI.
install-with:
  versions: unlocked
  project-uv-settings: ignore
  extras: dev
test: |
  # Every check runs; the step fails if any did.
  status=0
  # py-test job of inspect_swarm's build.yaml, plus --runslow for the Docker
  # tests its CI never runs (tests/conftest.py gates them behind --runslow).
  echo "::group::pytest"; uv run --no-sync pytest -ra --runslow || status=1; echo "::endgroup::"
  # py-pyright job of inspect_swarm's build.yaml.
  echo "::group::pyright"; uv run --no-sync pyright || status=1; echo "::endgroup::"
  exit $status

# inspect_swarm's offline test suite on the newest releases of everything (its own
# uv.lock and any exclude-newer window ignored).
name: inspect_swarm
repo: meridianlabs-ai/inspect_swarm
ref: main
cadence: nightly
python: "3.11"
timeout-minutes: 30
install: |
  uv venv
  uv pip install --exclude-newer false -e . --group dev
test: |
  uv run --no-sync pytest -ra

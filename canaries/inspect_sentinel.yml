# inspect_sentinel against inspect_ai and inspect_scout main and the newest
# releases of everything else, on the newest Python in its CI, as one canary so
# a break alerts once: tests, pyright, and the LiteLLM guardrail at each LiteLLM
# version sentinel's CI supports plus the newest LiteLLM release.
name: inspect_sentinel
repo: meridianlabs-ai/inspect_sentinel
ref: main
cadence: nightly
python: "3.14"
timeout-minutes: 60
# The shared install action does the install (see README.md, "install-with"):
# an editable install of the dev extra, with inspect_ai and inspect_scout main
# in the same resolution, so scout's inspect-ai requirement resolves to the git
# inspect_ai. The workflow step sets UV_NO_SOURCES, so uv ignores scout's git
# source for inspect-ai, which would conflict with the git URL here.
install-with:
  versions: unlocked
  project-uv-settings: ignore
  extras: dev
  also-install-unlocked: |
    git+https://github.com/UKGovernmentBEIS/inspect_ai.git@main
    git+https://github.com/meridianlabs-ai/inspect_scout.git@main
test: |
  # Every check runs; the step fails if any did.
  status=0
  echo "::group::pytest"; uv run --no-sync pytest || status=1; echo "::endgroup::"
  echo "::group::pyright"; uv run --no-sync pyright || status=1; echo "::endgroup::"
  # The guardrail runs in LiteLLM's process, so it's tested in an environment of
  # its own per LiteLLM version: the ones in sentinel's build.yaml, plus the newest.
  supported=$(yq '.jobs["litellm-guardrail"].strategy.matrix["litellm-version"][]' .github/workflows/build.yaml)
  newest=$(curl -fsS https://pypi.org/pypi/litellm/json | jq -r .info.version)
  test -n "$supported" && test -n "$newest"
  for version in $(printf '%s\n' $supported "$newest" | sort -uV); do
    echo "::group::LiteLLM $version"
    export CANARY_JUNIT_NAME=litellm-$version
    make test-litellm LITELLM="$version" || status=1
    make check-litellm LITELLM="$version" || status=1
    echo "::endgroup::"
  done
  exit $status

# inspect_viz's tests and mypy on the newest releases of everything.
name: inspect_viz-py314
repo: meridianlabs-ai/inspect_viz
ref: main
cadence: nightly
python: "3.14"
timeout-minutes: 30
install: |
  uv venv
  # Dependencies must install from wheels; only inspect_viz is built (as
  # PIP_ONLY_BINARY does in inspect_viz's CI).
  uv pip install --exclude-newer false --only-binary :all: --no-binary inspect-viz ".[dev]"
test: |
  status=0
  uv run --no-sync pytest -ra || status=1
  uv run --no-sync mypy src || status=1
  exit $status

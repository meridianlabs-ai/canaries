# petri_dish's offline test suite and pyright on the newest releases of
# everything (its own uv.lock and any exclude-newer window ignored).
name: petri_dish
repo: meridianlabs-ai/petri_dish
ref: main
cadence: nightly
python: "3.12"
timeout-minutes: 30
install: |
  uv venv
  uv pip install --exclude-newer false -e . --group dev
test: |
  # Every check runs; the step fails if any did.
  status=0
  # py-test job of petri_dish's build.yaml.
  echo "::group::pytest"; uv run --no-sync pytest -ra || status=1; echo "::endgroup::"
  # py-pyright job of petri_dish's build.yaml.
  echo "::group::pyright"; uv run --no-sync pyright || status=1; echo "::endgroup::"
  exit $status

# inspect_scout's tests and mypy against the newest released versions of
# everything, inspect_ai included (the Python jobs of inspect_scout's nightly),
# on the newest Python in its CI, as one canary so a break alerts once.
name: inspect_scout
repo: meridianlabs-ai/inspect_scout
ref: main
cadence: nightly
python: "3.14"
timeout-minutes: 30
# The shared install action does the install (see README.md, "install-with"):
# an editable install of the dev extra, like scout's own CI. --no-config (from
# project-uv-settings: ignore) drops the repo's per-package cooldowns, and
# --exclude-newer false (from versions: unlocked) clears the cooldown.
install-with:
  versions: unlocked
  project-uv-settings: ignore
  extras: dev
test: |
  # scout's Python jobs check out without the ts-mono submodule; with it, mypy
  # would also check ts-mono's Python fixtures.
  git submodule deinit --all --force
  # Every check runs; the step fails if any did.
  status=0
  echo "::group::pytest"; uv run --no-sync pytest -ra || status=1; echo "::endgroup::"
  echo "::group::mypy"; uv run --no-sync mypy src examples tests || status=1; echo "::endgroup::"
  exit $status

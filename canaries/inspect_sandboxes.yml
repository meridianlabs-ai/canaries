# inspect_sandboxes's offline test suite and pyright on the newest releases of
# everything (its own uv.lock and any exclude-newer window ignored).
name: inspect_sandboxes
repo: meridianlabs-ai/inspect_sandboxes
ref: main
cadence: nightly
python: "3.12"
timeout-minutes: 30
# The shared install action does the install (see README.md, "install-with"):
# an editable install of the dev extra. --no-config (from project-uv-settings:
# ignore) drops the repo's per-package cooldowns, and --exclude-newer false
# (from versions: unlocked) clears the cooldown.
install-with:
  versions: unlocked
  project-uv-settings: ignore
  extras: dev
test: |
  # Every check runs; the step fails if any did.
  status=0
  # py-test job of inspect_sandboxes's build.yaml. "not integration" skips the
  # tests that need real Modal/Daytona/E2B accounts (secrets).
  echo "::group::pytest"; uv run --no-sync pytest -ra -m "not integration" || status=1; echo "::endgroup::"
  # py-type job of inspect_sandboxes's build.yaml (uv run pyright).
  echo "::group::pyright"; uv run --no-sync pyright || status=1; echo "::endgroup::"
  exit $status

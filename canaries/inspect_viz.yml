# inspect_viz's tests and mypy on the newest releases of its Python
# dependencies, on the newest Python in its CI, as one canary so a break alerts once. The wheel ships the
# widgets prebuilt, with their JS dependencies fixed at build time, so the
# canary installs no JS.
name: inspect_viz
repo: meridianlabs-ai/inspect_viz
ref: main
cadence: nightly
python: "3.14"
timeout-minutes: 30
# The shared install action does the Python install (see README.md,
# "install-with"): an editable install of the dev extra, as inspect_viz's CI.
install-with:
  versions: unlocked
  project-uv-settings: ignore
  extras: dev
test: |
  # Every check runs; the step fails if any did.
  status=0
  echo "::group::pytest"; uv run --no-sync pytest -ra || status=1; echo "::endgroup::"
  echo "::group::mypy"; uv run --no-sync mypy src || status=1; echo "::endgroup::"
  exit $status

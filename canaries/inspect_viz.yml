# inspect_viz's tests and mypy on the newest releases of everything, on the
# newest Python in its CI, as one canary so a break alerts once.
name: inspect_viz
repo: meridianlabs-ai/inspect_viz
ref: main
cadence: nightly
python: "3.14"
timeout-minutes: 30
install: |
  uv venv
  # Dependencies must install from wheels; only inspect_viz is built (as
  # PIP_ONLY_BINARY does in inspect_viz's CI).
  uv pip install --exclude-newer false --only-binary :all: --no-binary inspect-viz ".[dev]"
test: |
  # Every check runs; the step fails if any did.
  status=0
  echo "::group::pytest"; uv run --no-sync pytest -ra || status=1; echo "::endgroup::"
  echo "::group::mypy"; uv run --no-sync mypy src || status=1; echo "::endgroup::"
  exit $status

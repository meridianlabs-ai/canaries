# inspect_swe's full suite, slow tests included (Docker sandbox installs, agent
# evals), plus mypy, on the newest releases of everything. Tests that need
# provider keys skip themselves here. Mirrors inspect-swe-nightly-tests.yml in
# meridianlabs-ai/actions, minus the keys.
name: inspect_swe
repo: meridianlabs-ai/inspect_swe
ref: main
cadence: nightly
python: "3.11"
timeout-minutes: 120
install: |
  uv venv
  # pytest-timeout and pytest-xdist aren't in the dev extra; google-genai lets
  # inspect_ai's Google provider import, so the gemini_cli tests skip cleanly.
  uv pip install --exclude-newer false -e ".[dev]" pytest-timeout pytest-xdist google-genai
test: |
  # Plain eval output keeps rich panels and progress bars out of the log.
  export INSPECT_DISPLAY=plain
  # Every check runs; the step fails if any did.
  status=0
  # py-test job of inspect_swe's build.yaml, with --runslow (nightly) as before.
  echo "::group::pytest"
  uv run --no-sync pytest --runslow -n auto --timeout=900 --timeout-method=signal \
    --durations=15 --tb=short -o log_level=warning || status=1
  echo "::endgroup::"
  # py-mypy job of inspect_swe's build.yaml. CI passes --python-executable
  # "$(which python)" because it installs without a venv; here pyproject's
  # python_executable (.venv/bin/python) already points mypy at this venv.
  echo "::group::mypy"; uv run --no-sync mypy || status=1; echo "::endgroup::"
  exit $status

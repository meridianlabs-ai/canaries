name: test

# On every pull request and push to main, so it can be a required check (a
# path-filtered required check never reports on PRs outside its paths).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Unit tests for the workflow scripts. No secrets, no installs.
  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s scripts -v

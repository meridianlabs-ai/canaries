name: canary

on:
  schedule:
    - cron: "0 */2 * * *" # 2h canaries
    - cron: "30 5 * * *" # nightly canaries (and the 2h ones)
  workflow_dispatch:
    inputs:
      only:
        description: Run only this canary (its name in canaries/)
        required: false
      test_slack:
        description: Only send a test message to the alert channel
        type: boolean
        default: false
  pull_request:
    paths:
      - canaries/**
      - scripts/**
      - .github/workflows/canary.yml

permissions:
  contents: read

concurrency:
  group: canary-${{ github.ref }}-${{ github.event.schedule || inputs.only || 'all' }}
  cancel-in-progress: false

jobs:
  plan:
    if: ${{ !inputs.test_slack }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: plan
        env:
          ONLY: ${{ inputs.only }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          for f in canaries/*.yml; do yq -o=json -I=0 '.' "$f"; done > "$RUNNER_TEMP/canaries.jsonl"
          echo "matrix=$(python3 scripts/plan.py "$RUNNER_TEMP/canaries.jsonl")" >> "$GITHUB_OUTPUT"

  # Installs and runs unvetted releases. Holds no secrets, saves and restores
  # no cache, and produces nothing any other job consumes.
  canary:
    needs: plan
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runs-on || 'ubuntu-latest' }}
    timeout-minutes: ${{ matrix.timeout-minutes }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.ref }}
          persist-credentials: false
          submodules: recursive
          # Tags so setuptools_scm/hatch-vcs compute the real version; without
          # them a package builds as 0.1.dev1 and fails its own version floors.
          fetch-depth: 0
          fetch-tags: true
          filter: "blob:none"

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.13.5
          python-version: ${{ matrix.python }}
          enable-cache: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ matrix.node }}
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      # Before anything is installed, so this line in the log is genuine;
      # scripts/notify.py reads the first one for the alert.
      - name: Record what we tested
        run: echo "canary-tested: ${{ matrix.repo }}@$(git rev-parse HEAD)"

      - name: Install the newest releases
        run: ${{ matrix.install }}

      - name: Installed versions
        if: ${{ !cancelled() }}
        run: uv pip list

      - name: Test
        run: ${{ matrix.test }}

  # The only job with secrets. It checks out this repository (no
  # credentials persisted) to run scripts/notify.py, which uses only the
  # Python standard library. It reads job results and logs through the API
  # and treats log text as untrusted: escaped, truncated and posted only in
  # code blocks under a label. Alerts only when a canary changes state.
  notify:
    needs: [plan, canary]
    if: ${{ always() && (inputs.test_slack || github.event_name == 'schedule') }}
    runs-on: ubuntu-latest
    environment: slack
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Post state changes to Slack
        env:
          SLACK_BOT_TOKEN: ${{ secrets.CANARY_SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ vars.CANARY_SLACK_CHANNEL_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.CANARY_SLACK_WEBHOOK_URL }}
          TEST_SLACK: ${{ inputs.test_slack }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/notify.py

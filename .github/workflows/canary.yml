name: canary

on:
  schedule:
    - cron: "0 */2 * * *" # 2h canaries, and nightly ones whose latest result is red
    - cron: "30 5 * * *" # nightly canaries (and the 2h ones)
  workflow_dispatch:
    inputs:
      only:
        description: Run only this canary, all its variants (its name in canaries/)
        required: false
      test_slack:
        description: Only send a test message to the alert channel
        type: boolean
        default: false
      repost_run:
        description: Only re-post the alerts (with details) for the red canaries of this earlier run ID
        required: false
  pull_request:
    paths:
      - canaries/**
      - scripts/**
      - .github/workflows/canary.yml

permissions:
  contents: read

concurrency:
  group: canary-${{ github.ref }}-${{ github.event.schedule || inputs.only || 'all' }}
  cancel-in-progress: false

jobs:
  # Runs only this repository's code. Reads earlier runs' job results (not logs)
  # to re-check red nightly canaries on the 2-hour schedule; no secrets.
  plan:
    if: ${{ !inputs.test_slack && !inputs.repost_run }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A pull request checks out its merge commit; the first parent is
          # the base, so the diff is what the PR changes.
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
      - id: plan
        env:
          ONLY: ${{ inputs.only }}
          SCHEDULE: ${{ github.event.schedule }}
          IS_PR: ${{ github.event_name == 'pull_request' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$IS_PR" = "true" ]; then
            CHANGED_FILES=$(git diff --name-only HEAD^1 HEAD)
            export CHANGED_FILES
          fi
          for f in canaries/*.yml; do yq -o=json -I=0 '.' "$f"; done > "$RUNNER_TEMP/canaries.jsonl"
          if ! python3 scripts/plan.py "$RUNNER_TEMP/canaries.jsonl" > "$RUNNER_TEMP/matrix" 2> "$RUNNER_TEMP/plan.log"; then
            cat "$RUNNER_TEMP/plan.log"
            exit 1
          fi
          # The planner's messages, then the number of jobs on the last line.
          sed '$d' "$RUNNER_TEMP/plan.log"
          echo "matrix=$(cat "$RUNNER_TEMP/matrix")" >> "$GITHUB_OUTPUT"
          echo "count=$(tail -n 1 "$RUNNER_TEMP/plan.log")" >> "$GITHUB_OUTPUT"

  # Installs and runs unvetted releases. Holds no secrets, saves and restores
  # no cache, and produces nothing any other job consumes. One job per canary,
  # or per variant (`<canary> (<label>)`), all in parallel.
  canary:
    needs: plan
    if: ${{ needs.plan.outputs.count != '0' }}
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runs-on || 'ubuntu-latest' }}
    timeout-minutes: ${{ matrix.timeout-minutes }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.ref }}
          path: ${{ matrix.dir }}
          persist-credentials: false
          submodules: recursive
          # Tags so setuptools_scm/hatch-vcs compute the real version; without
          # them a package builds as 0.1.dev1 and fails its own version floors.
          fetch-depth: 0
          fetch-tags: true
          filter: "blob:none"

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: 0.13.5
          python-version: ${{ matrix.python }}
          enable-cache: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ matrix.node }}
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      # Before anything is installed, so this line in the log is genuine;
      # scripts/notify.py reads the first one for the alert.
      - name: Record what we tested
        run: |
          echo "canary-tested: ${{ matrix.repo }}@$(git rev-parse HEAD)"

      - name: Install the newest releases
        run: ${{ matrix.install }}

      # One `canary-installed: <name> <version>` line per package, which
      # scripts/notify.py compares with the canary's last passing run.
      - name: Installed versions
        if: ${{ !cancelled() }}
        run: |
          uv pip list --format freeze | sed -e 's/==/ /' -e 's/^/canary-installed: /'

      - name: Test
        env:
          # pytest expands $CANARY_JUNIT_NAME when it reads this; a part that
          # runs pytest more than once sets a different name for each run.
          PYTEST_ADDOPTS: --junitxml=${{ runner.temp }}/junit/$CANARY_JUNIT_NAME.xml
          CANARY_JUNIT_NAME: pytest
        run: ${{ matrix.test }}

      # One `canary-failed: <id>` line per failed test in the JUnit reports,
      # which scripts/notify.py compares between runs to post only when the
      # failures change. Standard library only, isolated (-I) because the
      # working directory is the tested checkout. It never fails the job, so a
      # green Test stays green.
      - name: Failed tests
        if: ${{ !cancelled() }}
        run: |
          python3 -I - <<'PY'
          import glob, os, xml.etree.ElementTree as ET

          junit = os.path.join(os.environ["RUNNER_TEMP"], "junit")
          for path in sorted(glob.glob(os.path.join(junit, "*.xml"))):
              name = os.path.basename(path)
              try:
                  root = ET.parse(path).getroot()
                  failed = []
                  total = 0
                  for case in root.iter("testcase"):
                      total += 1
                      if case.find("failure") is not None or case.find("error") is not None:
                          classname = case.get("classname") or ""
                          testname = case.get("name") or ""
                          failed.append(f"{classname}::{testname}" if classname else testname)
                  print(f"canary-junit: {name} {total} {len(failed)}")
                  for test in failed:
                      print(f"canary-failed: {test}")
              except Exception:
                  print(f"canary-junit: {name} unreadable")
          PY

  # The only job with secrets. It checks out this repository (no
  # credentials persisted) to run scripts/notify.py, which uses only the
  # Python standard library. It reads job results and logs through the API
  # and treats log text as untrusted: escaped, truncated and posted only in
  # code blocks under a label. Alerts when a canary turns red, when its failed
  # tests change, and when it recovers.
  notify:
    needs: [plan, canary]
    if: ${{ always() && (inputs.test_slack || inputs.repost_run || github.event_name == 'schedule') }}
    runs-on: ubuntu-latest
    environment: slack
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Post red results and recoveries to Slack
        env:
          SLACK_BOT_TOKEN: ${{ secrets.CANARY_SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ vars.CANARY_SLACK_CHANNEL_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.CANARY_SLACK_WEBHOOK_URL }}
          TEST_SLACK: ${{ inputs.test_slack }}
          REPOST_RUN: ${{ inputs.repost_run }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/notify.py

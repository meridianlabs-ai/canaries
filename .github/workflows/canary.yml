name: canary

on:
  schedule:
    - cron: "0 */2 * * *" # 2h canaries
    - cron: "30 5 * * *" # nightly canaries (and the 2h ones)
  workflow_dispatch:
    inputs:
      only:
        description: Run only this canary (its name in canaries/)
        required: false
      test_slack:
        description: Only send a test message to the alert channel
        type: boolean
        default: false
  pull_request:
    paths:
      - canaries/**
      - scripts/**
      - .github/workflows/canary.yml

permissions:
  contents: read

concurrency:
  group: canary-${{ github.ref }}-${{ github.event.schedule || inputs.only || 'all' }}
  cancel-in-progress: false

jobs:
  plan:
    if: ${{ !inputs.test_slack }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: plan
        env:
          ONLY: ${{ inputs.only }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          for f in canaries/*.yml; do yq -o=json -I=0 '.' "$f"; done > "$RUNNER_TEMP/canaries.jsonl"
          echo "matrix=$(python3 scripts/plan.py "$RUNNER_TEMP/canaries.jsonl")" >> "$GITHUB_OUTPUT"

  # Installs and runs unvetted releases. Holds no secrets, saves and restores
  # no cache, and produces nothing any other job consumes.
  canary:
    needs: plan
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runs-on || 'ubuntu-latest' }}
    timeout-minutes: ${{ matrix.timeout-minutes }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.ref }}
          persist-credentials: false
          submodules: recursive
          # Tags so setuptools_scm/hatch-vcs compute the real version; without
          # them a package builds as 0.1.dev1 and fails its own version floors.
          fetch-depth: 0
          fetch-tags: true
          filter: "blob:none"

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.13.5
          python-version: ${{ matrix.python }}
          enable-cache: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ matrix.node }}
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Record what we tested
        run: git rev-parse HEAD

      - name: Install the newest releases
        run: ${{ matrix.install }}

      - name: Installed versions
        if: ${{ !cancelled() }}
        run: uv pip list

      - name: Test
        run: ${{ matrix.test }}

  # The only job with a secret. It checks out nothing and runs no third-party
  # code; it reads only the canary job results.
  notify:
    needs: [plan, canary]
    if: ${{ always() && (inputs.test_slack || (failure() && github.event_name == 'schedule')) }}
    runs-on: ubuntu-latest
    environment: slack
    permissions:
      actions: read
      contents: read
    steps:
      - name: Post failed canaries to Slack
        env:
          WEBHOOK: ${{ secrets.CANARY_SLACK_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "CANARY_SLACK_WEBHOOK_URL is not set; skipping." && exit 0
          fi
          if [ "${{ inputs.test_slack }}" = "true" ]; then
            jq -n --arg text "Canaries test message: alerts are wired up. $RUN_URL" '{text: $text}' \
              | curl -fsS -X POST -H 'Content-Type: application/json' --data @- "$WEBHOOK"
            exit 0
          fi
          failed=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs?per_page=100" \
            --jq '[.jobs[] | select(.conclusion == "failure") | .name] | join(", ")')
          text="Canary failed: ${failed:-see run}. Newest upstream releases broke something. $RUN_URL"
          jq -n --arg text "$text" '{text: $text}' | curl -fsS -X POST -H 'Content-Type: application/json' --data @- "$WEBHOOK"

name: secrets

# Canary jobs install and run unreviewed releases, so no secret may reach them.
# An organization secret shared with all repositories would reach a canary run.
# This check reads the `secrets` context. It fails the run if any secret other
# than `github_token` is visible. On Dependabot pull request runs, the context
# holds Dependabot secrets in place of Actions secrets. So those runs fail on any
# Dependabot secret visible to this repository. Fork pull request runs get only
# `github_token`, so they prove nothing. The schedule and push runs are the real
# signal.
on:
  schedule:
    - cron: "17 6 * * *"
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  no-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/check_secrets.py
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
